name: Deploy Connexiba to Namecheap

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy website to Namecheap
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /
          # Phase 1 dry-run confirmed the old state file (v2) made the
          # action believe every file already matched the server and
          # upload 0 files. Renamed to v3 so it re-evaluates every
          # included file fresh, without dangerous-clean-slate - normal
          # exclude/state-based scope only, nothing outside this repo's
          # tracked files is touched.
          state-name: .ftp-deploy-sync-state-v3.json
          dangerous-clean-slate: false
          dry-run: false
          log-level: verbose
          # AI CRM / AI Workforce project (app dir, config/secrets, and
          # governance/spec docs) is excluded below — added Phase 1,
          # Segment 1 (deployment safety). None of it is marketing-site
          # content. NOTE: this is a YAML literal block scalar (`|`) — every
          # line below is taken as a literal exclude pattern; `#` does NOT
          # start a comment inside it, so no inline comments belong in it.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/ai-crm-prototype/**
            **/AI_CRM_CLAUDE.md
            **/CRM_SPECIFICATION.md
            **/AI_AGENT_SPECIFICATION.md
            **/AUTOMATION_SPECIFICATION.md
            **/PROJECT_INVESTIGATION.md
            **/.env
            **/.env.*
            **/config.php
            **/vendor/**
            **/CLAUDE.md
            **/.impeccable/**
            **/.agents/**
            **/.claude/**
            **/skills-lock.json
            **/logo-check.txt
            **/start-crm.bat
            **/template.html
            **/terms.template.html
            **/locales/**
            **/build-i18n.js
            **/build-report.json
            **/prototype/**
            **/reference/**
            **/staging/**
            **/_production-backup-before-prototype-migration/**
            **/motionsites-connexiba-preview.html
            **/motionsites-cta-preview.html
            **/assets/*.msi
            **/assets/*.zip
            **/assets/nssm-2.24-101-g897c7ad/**
            **/assets/*.docx
            **/assets/index*.html
            **/assets/connexiba.com-source-beautified.txt
